name: Grab datasheets

on:
  schedule:
    - cron: "23 11 * * 1"   # Mondays ~6:23 AM ET
  workflow_dispatch:
    inputs:
      force:
        description: "Re-download everything"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  grab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Download datasheets
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python pa_grabber.py --force
          else
            python pa_grabber.py
          fi

      - name: Convert to JSON
        run: python pa_normalize.py --check

      - name: Commit changes
        run: |
          git config user.name "pa-grabber"
          git config user.email "actions@users.noreply.github.com"
          git add -A datasheets manifest.json data reports
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Datasheets update $(date -u +%Y-%m-%d)"
            git push
          fi
