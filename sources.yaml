# Where pa_grabber.py looks for Palo Alto Networks firewall datasheets.
#
# crawl_pages: pages whose links to /resources/datasheets/<slug> are harvested,
#   plus any direct datasheet PDF links (/content/dam/.../datasheets/...pdf).
# extra_slugs: datasheet pages to always include (not linked from crawl_pages).
# extra_pdfs: direct PDF files to always include (old datasheets no page links).
# include / exclude: regex filters on the slug (or PDF file name). A slug must
#   match an include pattern and no exclude pattern.

crawl_pages:
  - https://www.paloaltonetworks.com/resources/pa-series-next-generation-firewalls-hardware-architectures
  - https://www.paloaltonetworks.com/network-security/next-generation-firewall-hardware
  - https://www.paloaltonetworks.com/network-security/vm-series-virtual-next-generation-firewall
  # Legacy (end-of-sale) models: the Resources column links each model's datasheet.
  - https://www.paloaltonetworks.com/services/support/end-of-life-announcements/hardware-end-of-life-dates

extra_slugs:
  - product-summary-specsheet
  # Legacy models the EOL page links only to a hardware guide on docs.paloaltonetworks.com
  - pa-220r                       # PA-220R (end of sale Jan 31, 2025)
  - pa-800-series-datasheet       # PA-820, PA-850 (end of sale Aug 31, 2024)

extra_pdfs:
  # Oldest models: the EOL page links only a product page, and the
  # /resources/datasheets/ pages are gone. These 2013 specsheets are still
  # on Palo Alto's media server.
  - name: specsheet-pa-200.pdf
    url: https://media.paloaltonetworks.com/documents/specsheet-pa-200.pdf
  - name: specsheet-pa-3000.pdf
    url: https://media.paloaltonetworks.com/documents/specsheet-pa-3000.pdf
  - name: specsheet-pa-5000.pdf
    url: https://media.paloaltonetworks.com/documents/specsheet-pa-5000.pdf

include:
  - '^pa-'
  - 'vm-series'
  - 'cn-series'
  - 'product-summary'
  - 'firewall'
  - '^k2-series$'

exclude:
  - 'panorama'
  - 'privacy'
  - 'service-description'
  - 'pan-os-\d'      # older per-PAN-OS copies of a datasheet (e.g. pa-800-series-pan-os-10-2)
